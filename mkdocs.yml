site_name: Nutrition API — Documentation
site_description: Documentation technique du projet Nutrition API
site_author: Maxime Ghalem
docs_dir: pages
site_dir: site

theme:
  name: material
  language: fr
  palette:
    - scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Mode sombre
    - scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Mode clair
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.code.copy

plugins:
  - search:
      lang: fr
  - mermaid2
  # Réorganisation par système du 2026-07-26 : les anciennes URLs sont citées dans des
  # commentaires Jira. Ne jamais supprimer une entrée — seulement en ajouter.
  - redirects:
      redirect_maps:
        backend/features/README.md: backend/systemes/index.md
        backend/features/utilisateur/authentification.md: backend/systemes/authentification/index.md
        backend/features/utilisateur/profil-utilisateur.md: backend/systemes/profil-utilisateur/index.md
        backend/features/utilisateur/diet-plan.md: backend/systemes/diet-plan/index.md
        backend/features/utilisateur/diet.md: backend/systemes/diet/index.md
        backend/features/utilisateur/repas.md: backend/systemes/repas/index.md
        backend/features/utilisateur/suivi-poids.md: backend/systemes/suivi-poids/index.md
        backend/features/utilisateur/bilan-nutritionnel.md: backend/systemes/bilan-nutritionnel/index.md
        backend/features/utilisateur/aliments.md: backend/systemes/aliments/index.md
        backend/features/utilisateur/abonnements.md: backend/systemes/abonnements/index.md
        backend/features/utilisateur/rgpd-droits-utilisateur.md: backend/systemes/rgpd/index.md
        backend/features/interne/nutrition-calculator.md: backend/systemes/bilan-nutritionnel/moteur-de-calcul.md
        backend/features/interne/recherche-aliments-cache.md: backend/systemes/aliments/cache-recherche.md
        backend/features/interne/mise-a-disposition-aliments.md: backend/systemes/aliments/mise-a-disposition.md
        backend/features/interne/rgpd-purge-comptes.md: backend/systemes/rgpd/purge-des-comptes.md
        backend/features/interne/admin-dashboard.md: backend/systemes/administration/index.md
        backend/features/interne/openapi.md: backend/systemes/plateforme/openapi.md
        backend/features/interne/exception-filter.md: backend/systemes/plateforme/exception-filter.md
        backend/features/interne/niveaux-de-tests.md: backend/qualite/niveaux-de-tests.md
        backend/features/interne/recensement-des-tests.md: backend/qualite/recensement-des-tests.md
        backend/annexes/workflow-cache-recherche-aliments.md: backend/systemes/aliments/workflow-cache-recherche.md
        backend/annexes/workflow-import-aliments.md: backend/systemes/aliments/workflow-import.md
        backend/annexes/infrastructure-import-off.md: backend/systemes/aliments/source-open-food-facts.md
        backend/annexes/infrastructure-redis.md: backend/briques/redis.md
        backend/annexes/infrastructure-hangfire.md: backend/briques/hangfire.md
        backend/annexes/infrastructure-keycloak-admin.md: backend/briques/keycloak-admin.md
        backend/annexes/infrastructure-stripe.md: backend/briques/stripe.md
        backend/annexes/infrastructure-setup.md: backend/briques/environnement-local.md
        backend/annexes/infrastructure-docs.md: backend/briques/publication-docs.md
        backend/annexes/Diagramme-classes.md: backend/reference/diagramme-classes.md
        backend/annexes/workflows.md: backend/reference/flux-metier.md
        backend/annexes/concept-moteur-architecture.md: backend/reference/concept-moteur.md
        backend/ticket-rules.md: backend/reference/regles-tickets.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.highlight:
      pygments_lang_class: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

nav:
  - Accueil: index.md

  - Spécifications:
    - Introduction: backend/1.nutrition-introduction.md
    - Cas d'usage: backend/2.nutrition-cas-usage.md
    - Specs fonctionnelles: backend/3.nutrition-specifications-fonctionnelles.md
    - Specs techniques: backend/4.nutrition-specifications-techniques.md
    - Contraintes: backend/5.nutrition-contraintes.md
    - Abonnements: backend/6.nutrition-abonnements.md
    - Administration: backend/7.nutrition-admin.md

  - Design:
    - Modèle domaine: backend/design/design-domain.md
    - Règles métier: backend/design/Regles-metier.md
    - Règles métier consolidées: backend/design/regles-metier-consolidees.md
    - Application Layer: backend/design/design-application.md
    - Infrastructure Layer: backend/design/design-infrastructure.md
    - API Layer — Contrats: backend/design/design-api.md
    - API Layer — Infrastructure: backend/design/design-api-infrastructure.md
    - Stratégie de tests: backend/design/design-tests.md

  - Systèmes:
    - Vue d'ensemble: backend/systemes/index.md
    - Authentification: backend/systemes/authentification/index.md
    - Profil utilisateur: backend/systemes/profil-utilisateur/index.md
    - Diet Plan: backend/systemes/diet-plan/index.md
    - Diet: backend/systemes/diet/index.md
    - Repas: backend/systemes/repas/index.md
    - Suivi du poids: backend/systemes/suivi-poids/index.md
    - Aliments:
      - Recherche d'aliments: backend/systemes/aliments/index.md
      - Cache des recherches: backend/systemes/aliments/cache-recherche.md
      - Workflow — Cache des recherches: backend/systemes/aliments/workflow-cache-recherche.md
      - Mise à disposition du catalogue: backend/systemes/aliments/mise-a-disposition.md
      - Workflow — Import du catalogue: backend/systemes/aliments/workflow-import.md
      - Source Open Food Facts: backend/systemes/aliments/source-open-food-facts.md
    - Bilan nutritionnel:
      - Bilan nutritionnel: backend/systemes/bilan-nutritionnel/index.md
      - Moteur de calcul: backend/systemes/bilan-nutritionnel/moteur-de-calcul.md
    - Abonnements: backend/systemes/abonnements/index.md
    - RGPD:
      - Droits de l'utilisateur: backend/systemes/rgpd/index.md
      - Purge des comptes: backend/systemes/rgpd/purge-des-comptes.md
    - Administration: backend/systemes/administration/index.md
    - Plateforme API:
      - Pipeline HTTP: backend/systemes/plateforme/pipeline-http.md
      - OpenAPI: backend/systemes/plateforme/openapi.md
      - Exception Filter: backend/systemes/plateforme/exception-filter.md

  - Briques techniques:
    - Environnement local: backend/briques/environnement-local.md
    - Redis: backend/briques/redis.md
    - Hangfire: backend/briques/hangfire.md
    - Keycloak Admin: backend/briques/keycloak-admin.md
    - Stripe: backend/briques/stripe.md
    - Publication de la documentation: backend/briques/publication-docs.md

  - Qualité:
