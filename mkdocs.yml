site_name: Nutrition API — Documentation
site_description: Documentation technique du projet Nutrition API
site_author: Maxime Ghalem
docs_dir: pages
site_dir: site

theme:
  name: material
  language: fr
  palette:
    - scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Mode sombre
    - scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Mode clair
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.code.copy

plugins:
  - search:
      lang: fr
  - mermaid2

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.highlight:
      pygments_lang_class: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

nav:
  - Accueil: index.md

  - Spécifications:
    - Introduction: backend/1.nutrition-introduction.md
    - Cas d'usage: backend/2.nutrition-cas-usage.md
    - Specs fonctionnelles: backend/3.nutrition-specifications-fonctionnelles.md
    - Specs techniques: backend/4.nutrition-specifications-techniques.md
    - Contraintes: backend/5.nutrition-contraintes.md
    - Abonnements: backend/6.nutrition-abonnements.md
    - Administration: backend/7.nutrition-admin.md

  - Domaine:
    - Modèle domaine: backend/design/design-domain.md
    - Règles métier: backend/design/Regles-metier.md
    - Diagramme de classes: backend/annexes/Diagramme-classes.md

  - Design:
    - Domain Layer: backend/design/design-domain.md
    - Application Layer: backend/design/design-application.md
    - Infrastructure Layer: backend/design/design-infrastructure.md
    - API Layer — Contrats: backend/design/design-api.md
    - API Layer — Infrastructure: backend/design/design-api-infrastructure.md

  - Features:
    - Vue d'ensemble: backend/features/README.md
    - Utilisateur:
      - Authentification: backend/features/utilisateur/authentification.md
      - Profil utilisateur: backend/features/utilisateur/profil-utilisateur.md
      - Diet Plan: backend/features/utilisateur/diet-plan.md
      - Diet: backend/features/utilisateur/diet.md
      - Repas: backend/features/utilisateur/repas.md
      - Aliments: backend/features/utilisateur/aliments.md
      - Bilan nutritionnel: backend/features/utilisateur/bilan-nutritionnel.md
      - Suivi du poids: backend/features/utilisateur/suivi-poids.md
      - Abonnements: backend/features/utilisateur/abonnements.md
      - RGPD — Droits de l'utilisateur: backend/features/utilisateur/rgpd-droits-utilisateur.md
    - Interne:
      - Admin dashboard: backend/features/interne/admin-dashboard.md
      - RGPD — Purge des comptes: backend/features/interne/rgpd-purge-comptes.md
      - OpenAPI: backend/features/interne/openapi.md
